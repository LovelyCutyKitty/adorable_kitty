<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c39"><title>Dow innovation 제품 재고관리</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles-v5.css"></head><body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">DOW INNOVATION</p><h1>제품 재고관리</h1></div><button id="menuButton" class="icon" type="button">⋮</button></header><nav class="tabs four"><button class="tab active" data-view="dashboard">현황</button><button class="tab" data-view="orders">발주</button><button class="tab" data-view="inventory">재고</button><button class="tab" data-view="products">제품</button></nav>
<section id="dashboardView" class="view"><div class="hero"><div><span id="todayLabel"></span><strong>발주 현황</strong></div><button class="primary compact-action" data-new-order>발주<br>추가</button></div><section id="summaryCards" class="summary-grid"></section><input id="dashboardSearch" class="search" placeholder="발주처·제품명·규격 검색"><section id="priorityList" class="groups"></section><section id="dashboardGroups" class="groups"></section></section>
<section id="ordersView" class="view hidden"><div class="page-head"><div><h2>발주 관리</h2><p>발주처를 누른 뒤 발주 건과 제품을 확인합니다.</p></div><button class="primary compact-action" data-new-order>발주<br>추가</button></div><input id="orderSearch" class="search" placeholder="발주처·제품명·규격 검색"><section id="orderGroups" class="groups"></section></section>
<section id="inventoryView" class="view hidden"><div class="page-head"><div><h2>재고 관리</h2><p>생산완료는 공장 전체 재고에 먼저 쌓입니다.</p></div><button id="newProduct" class="primary compact-action">초기재고<br>입력</button></div><input id="inventorySearch" class="search" placeholder="제품명 또는 규격 검색"><div class="subtabs"><button class="subtab active" data-stock-mode="all">공장 전체 재고</button><button class="subtab" data-stock-mode="order">발주별 제품</button></div><section id="inventoryContent"></section></section><section id="productsView" class="view hidden"><div class="page-head"><div><h2>제품 관리</h2><p>미분류 제품을 표준 제품으로 정리합니다.</p></div></div><input id="productSearch" class="search" placeholder="제품명 또는 규격 검색"><section id="productContent"></section></section></main>
<dialog id="orderDialog" class="dialog"><form id="orderForm"><div class="dialog-head"><h2>발주 추가</h2><button class="close" type="button" data-close>×</button></div><label>카톡 발주 메시지 (선택)<textarea id="messageInput" rows="7" placeholder="카톡 메시지를 붙여넣거나, 아래에서 제품을 직접 추가하세요."></textarea></label><button id="parseButton" class="secondary full" type="button">내용 읽어오기</button><p id="parseNotice" class="notice hidden"></p><div id="lineEditor"><p class="edit-note">카톡을 넣지 않아도 아래에서 제품·규격·수량을 직접 추가할 수 있습니다.</p><div class="line-head"><span>제품명</span><span>규격 및 용량</span><span>발주예정수량</span></div><div id="parsedLines"></div><button id="addLine" class="secondary full" type="button">+ 제품 한 줄 추가</button></div><label>발주처<input id="companyInput" required placeholder="예: 하나"></label><div class="two"><label>발주일<input id="orderDateInput" type="date" required></label><label>납기일<input id="dueDateInput" type="date"></label></div><label>발송 요청 / 메모<input id="orderMemoInput"></label><div id="mergeOptions" class="merge-options hidden"></div><div class="actions"><button class="secondary" data-close type="button">취소</button><button class="primary" type="submit">발주 저장</button></div></form></dialog>
<dialog id="lineDialog" class="dialog"><form id="lineForm"><div class="dialog-head"><h2 id="lineTitle">제품 진행</h2><button class="close" type="button" data-close>×</button></div><div id="lineInfo" class="info"></div><label>생산예정 수량<input id="plannedInput" type="number" min="0" step="0.01"></label><label>이번 생산완료 수량 (생산예정에서 차감 · 공장재고 증가)<input id="producedInput" type="number" min="0" step="0.01" placeholder="오늘 완료한 수량"></label><label>이번 출고 수량 (공장 전체 재고 차감)<input id="shippedInput" type="number" min="0" step="0.01" placeholder="이번에 출고한 수량"></label><div class="actions"><button class="secondary" data-close type="button">취소</button><button class="primary" type="submit">수량 반영</button></div></form></dialog>
<dialog id="productDialog" class="dialog"><form id="productForm"><div class="dialog-head"><h2>공장 제품 등록</h2><button class="close" type="button" data-close>×</button></div><label>표시 제품명<input id="productName" required></label><label>규격 및 용량<input id="productSpec" required></label><div class="two"><label>제품 코드<input id="productCode" placeholder="예: S1"></label><label>분류<select id="productCategory"><option value="S1 레진빔">S1 레진빔</option><option value="S2 프레스빔">S2 프레스빔</option><option value="S3 빨간빔">S3 빨간빔</option><option value="B1 튜브형 본드">B1 튜브형 본드</option><option value="B2 카트리지형 본드">B2 카트리지형 본드</option><option value="W1 왁스">W1 왁스</option><option value="MABOR">MABOR</option><option value="기타·미분류">기타·미분류</option><option value="빔">빔 (기존 분류)</option><option value="본드">본드 (기존 분류)</option><option value="왁스">왁스 (기존 분류)</option><option value="접시">접시 (기존 분류)</option><option value="미분류·기타">미분류·기타 (기존 분류)</option></select></label></div><div class="two"><label>초기재고<input id="openingStock" type="number" min="0" step="0.01" value="0"></label><label>단위<input id="productUnit" value="개" required placeholder="예: 개, kg, 세트, 장"></label></div><div class="actions"><button class="secondary" data-close type="button">취소</button><button class="primary" type="submit">저장</button></div></form></dialog>
<dialog id="adjustDialog" class="dialog"><form id="adjustForm"><div class="dialog-head"><h2>재고 수정</h2><button class="close" type="button" data-close>×</button></div><div id="adjustInfo" class="info"></div><label>실제 현재 재고<input id="actualStockInput" type="number" min="0" step="0.01"></label><label>수정 사유<input id="adjustReasonInput" placeholder="예: 실사 재고 반영"></label><div class="actions"><button class="secondary" type="button" data-close>취소</button><button class="primary" type="submit">재고 수정</button></div></form></dialog><dialog id="summaryDialog" class="dialog"><div><div class="dialog-head"><h2 id="summaryTitle">현황 상세</h2><button class="close" type="button" data-close>×</button></div><div id="summaryList"></div></div></dialog><dialog id="menuDialog" class="dialog"><div><div class="dialog-head"><h2>관리 메뉴</h2><button class="close" type="button" data-close>×</button></div><button id="exportButton" class="menu-item">데이터 백업하기</button><label class="menu-item">데이터 복원하기<input id="importInput" type="file" accept="application/json" hidden></label><button id="resetButton" class="menu-item danger">모든 데이터 초기화</button></div></dialog><div id="toast" class="toast hidden"></div><script src="app-v13.js"></script><script src="enhance-v13.js?rev=15"></script></body></html>
