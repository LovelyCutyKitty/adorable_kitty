<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f52"><title>토익스피킹 말따</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="app-shell"><header><div><p class="eyebrow">TOEIC SPEAKING</p><h1>만능문장 말따</h1></div><button id="reset" class="text">초기화</button></header>
<section id="home"><div class="card intro"><b>한 문장씩 듣고, 말하고, 시험 보세요.</b><p id="status" class="muted"></p></div><div id="parts" class="grid"></div><div class="grid"><button class="mode" data-mode="memorize"><strong>암기 모드</strong><span>영어 4회 반복 재생</span></button><button class="mode" data-mode="test"><strong>시험 모드</strong><span>한글만 보고 영어 출력</span></button><button class="mode" data-mode="review"><strong>재훈련</strong><span>애매함·틀림만 다시</span></button><button class="mode" data-mode="all"><strong>전체 랜덤</strong><span>Part 2~5 섞어서</span></button></div><section class="card stats"><div><span>암기 완료</span><strong id="done">0</strong></div><div><span>재훈련</span><strong id="reviewCount">0</strong></div><div><span>누적 발화</span><strong id="spoken">0</strong></div></section></section>
<section id="study" class="hidden"><div class="top"><button id="back" class="text">‹ 나가기</button><span id="label"></span></div><div class="progress"><i id="bar"></i></div><div class="card prompt"><p class="eyebrow" id="part"></p><h2 id="korean"></h2><p id="english" class="english hidden"></p></div><div id="audio" class="card controls"><label>반복 <select id="repeat"><option value="1">1회</option><option value="2">2회</option><option value="4" selected>4회</option></select></label><label>속도 <select id="rate"><option value="0.8">0.8배</option><option value="1" selected>1.0배</option><option value="1.15">1.15배</option></select></label><button id="play" class="primary">▶ 재생</button><button id="stop">■</button><small id="voice"></small></div><div id="testTools" class="card hidden"><button id="showAnswer">정답 보기</button><div id="answer" class="english hidden"></div></div><div class="actions"><button data-result="done" class="primary">암기 완료</button><button data-result="maybe">애매함</button><button data-result="wrong">틀림</button><button id="next">다음 ›</button></div></section></main><script src="data.js"></script><script src="app.js"></script></body></html>
