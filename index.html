<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2747" />
  <title>토목기사 실기 말따먹기</title>
  <script>
    (() => {
      const version = 'civil-ux-20260830-3';
      const url = new URL(window.location.href);
      if (url.searchParams.get('v') !== version) {
        url.searchParams.set('v', version);
        window.location.replace(url.toString());
      }
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest?v=civil-ux-20260830-3" />
  <link rel="stylesheet" href="styles-civil-v2.css?v=civil-ux-20260830-3" />
  <link rel="stylesheet" href="civil-ui-patch.css?v=civil-ux-20260830-3" />
</head>
<body>
<main class="app-shell">
  <header>
    <div><p class="eyebrow">토목기사 실기</p><h1>말따먹기</h1></div>
    <button class="text-button" id="resetButton" type="button">초기화</button>
  </header>

  <section id="homeView" class="view">
    <div class="intro card">
      <p>내 계획에 맞게 문제 수와 범위를 정하고, 기록을 쌓으며 반복 학습하세요.</p>
      <div id="dataStatus" class="muted">문제 데이터를 불러오는 중...</div>
    </div>

    <p class="section-title">문제 풀기</p>
    <div class="mode-grid">
      <button class="mode-card" data-mode="random" type="button"><strong>랜덤 문제</strong><span>문제 수를 직접 정해 무작위 출제</span></button>
      <button class="mode-card" data-mode="frequent" type="button"><strong>빈출 문제</strong><span>출제빈도 기준을 직접 선택</span></button>
      <button class="mode-card" data-mode="wrong" type="button"><strong>오답 복습</strong><span>복습할 오답을 직접 선택</span></button>
      <button class="mode-card" data-mode="round" type="button"><strong>회차별 풀이</strong><span>정답은 마지막에 공개</span></button>
      <button class="mode-card" data-mode="favorite" type="button"><strong>즐겨찾기 ★</strong><span>별표한 문제만 모아서 학습</span></button>
    </div>

    <p class="section-title">나의 학습</p>
    <div class="mode-grid personal-grid">
      <button class="mode-card" data-panel="sets" type="button"><strong>나만의 학습세트</strong><span>원하는 문제를 직접 묶어 관리</span></button>
      <button class="mode-card" data-panel="stats" type="button"><strong>학습 통계</strong><span>평균·최고 정답률과 학습 현황</span></button>
      <button class="mode-card" data-panel="history" type="button"><strong>시험 이력</strong><span>날짜별 풀이 결과 확인</span></button>
      <button class="mode-card" data-panel="daily" type="button"><strong>일별 학습</strong><span>풀이량과 정답률 변화</span></button>
    </div>

    <section id="randomPicker" class="card hidden picker-card">
      <div class="picker-head"><strong>랜덤 문제 수</strong><button class="text-button close-picker" type="button">닫기</button></div>
      <div class="count-options">
        <button data-count="5" type="button">5</button>
        <button data-count="10" type="button">10</button>
        <button class="recommended selected" data-count="12" type="button"><span class="recommend-badge">추천</span>12</button>
        <button data-count="20" type="button">20</button>
        <button data-count="all" type="button">전체</button>
      </div>
      <label class="field-label" for="randomCountInput">직접 입력</label>
      <div class="inline-field"><input id="randomCountInput" type="number" min="1" inputmode="numeric" value="12"><span>문제</span></div>
      <button id="startRandomButton" class="primary wide" type="button">시작하기</button>
    </section>

    <section id="frequentPicker" class="card hidden picker-card">
      <div class="picker-head"><strong>빈출 문제 설정</strong><button class="text-button close-picker" type="button">닫기</button></div>
      <div id="frequencyOptions" class="count-options frequency-options"></div>
      <p id="frequentCountText" class="muted"></p>
      <p id="frequentProgressText" class="muted"></p>
      <div class="dual-actions"><button id="continueFrequentButton" class="primary" type="button">이어서 풀기</button><button id="restartFrequentButton" class="secondary" type="button">처음부터 풀기</button></div>
    </section>

    <section id="roundPicker" class="card hidden picker-card">
      <div class="picker-head"><strong>회차별 풀이</strong><button class="text-button close-picker" type="button">닫기</button></div>
      <label class="field-label" for="roundSelect">회차 선택</label>
      <select id="roundSelect"></select>
      <button id="startRoundExamButton" class="primary wide" type="button">선택 회차 시작</button>
      <button id="startRoundExplainButton" class="hidden" type="button" aria-hidden="true" tabindex="-1"></button>
    </section>

    <section id="listPicker" class="card hidden picker-card">
      <div class="picker-head"><strong id="listPickerTitle">문제 선택</strong><button class="text-button close-picker" type="button">닫기</button></div>
      <div class="list-tools"><button id="selectAllButton" class="small-button" type="button">전체 선택</button><button id="clearAllButton" class="small-button" type="button">전체 해제</button><span id="selectedCountText" class="muted"></span></div>
      <div id="selectableQuestionList" class="selectable-list"></div>
      <button id="startSelectedButton" class="primary wide" type="button">선택 문제 풀기</button>
    </section>

    <section class="stats card home-stats">
      <div><span>오답</span><strong id="wrongCount">0</strong></div>
      <div><span>즐겨찾기</span><strong id="favoriteCount">0</strong></div>
      <div><span>누적 풀이</span><strong id="solvedCount">0문제</strong></div>
      <div><span>전체 항목</span><strong id="uniqueCount">0</strong></div>
    </section>
  </section>

  <section id="quizView" class="view hidden">
    <div class="quiz-top"><button id="backButton" class="text-button" type="button">‹ 나가기</button><span id="modeLabel"></span></div>
    <div class="progress-row"><span id="roundLabel"></span><strong id="progressLabel"></strong></div>
    <div class="meter"><i id="meterFill"></i></div>
    <div class="meta-card"><div><span class="meta-title">빈도수</span><strong id="frequencyText">-</strong></div><div><span class="meta-title">출제년도·회차</span><span id="appearancesText">-</span></div></div>
    <article class="question-card">
      <div class="question-heading"><h2>문제</h2><button id="favoriteButton" class="favorite-button" type="button" aria-label="즐겨찾기">☆</button></div>
      <p id="questionText"></p>
    </article>
    <div id="explainAnswerBox" class="explain-answer hidden"><span class="meta-title">정답</span><p id="explainAnswerText"></p></div>
    <div id="answerArea">
      <label class="answer-label" for="answerInput">답 입력</label>
      <textarea id="answerInput" rows="7" placeholder="줄바꿈이나 쉼표로 항목을 나누어 입력하세요."></textarea>
    </div>
    <div class="actions"><button id="submitButton" class="primary" type="button">제출</button><button id="nextButton" class="secondary hidden" type="button">다음 문제</button></div>
    <div id="resultBox" class="result hidden"></div>
    <div id="afterAnswerActions" class="after-actions hidden"><button id="correctButton" type="button">정답으로 처리</button><button id="memorizedButton" type="button">확실히 암기</button></div>
  </section>

  <section id="summaryView" class="view hidden">
    <div class="summary card"><p class="eyebrow" id="summaryMode"></p><h2 id="summaryTitle">풀이 완료</h2><strong id="summaryScore"></strong><p id="summaryText"></p><button id="summaryWrongButton" class="secondary wide hidden" type="button">틀린 문제 보기</button><button id="summaryHomeButton" class="primary wide" type="button">처음으로</button></div>
    <section id="roundResults" class="hidden"></section>
  </section>

  <section id="panelView" class="view hidden">
    <div class="quiz-top"><button id="panelBackButton" class="text-button" type="button">‹ 처음으로</button><strong id="panelTitle"></strong></div>
    <div id="panelContent"></div>
  </section>
</main>

<div id="setModal" class="modal hidden"><div class="modal-card">
  <div class="picker-head"><strong id="setModalTitle">학습세트 만들기</strong><button id="closeSetModal" class="text-button" type="button">닫기</button></div>
  <input id="setNameInput" class="text-input" placeholder="세트 이름을 입력하세요">
  <input id="setSearchInput" class="text-input" placeholder="문제 검색">
  <div class="filter-grid">
    <select id="setFrequencyFilter"></select>
    <select id="setStatusFilter"><option value="all">상태 전체</option><option value="favorite">즐겨찾기</option><option value="wrong">현재 오답</option><option value="memorized">확실히 암기</option><option value="normal">일반 문제</option></select>
    <select id="setYearFilter"></select>
  </div>
  <div class="list-tools"><button id="setSelectAllButton" class="small-button" type="button">현재 목록 전체 선택</button><button id="setClearButton" class="small-button" type="button">선택 해제</button><span id="setSelectedCount" class="muted"></span></div>
  <div id="setQuestionList" class="selectable-list modal-list"></div>
  <button id="saveSetButton" class="primary wide" type="button">학습세트 저장</button>
</div></div>

<script src="data/questions.js?v=civil-ux-20260830-3"></script>
<script src="app-civil-v2.js?v=civil-ux-20260830-3"></script>
<script src="civil-ui-patch.js?v=civil-ux-20260830-3"></script>
</body>
</html>
